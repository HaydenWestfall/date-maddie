<div class="card step-card">
  <div class="step-icon">🔞</div>
  <h2>Adults only</h2>
  <p class="subtext">
    What's behind this door is intended for mature audiences (18+) only. By
    continuing, you confirm you're old enough to be here.
  </p>

  <button
    type="button"
    class="primary-button continue-button"
    (click)="acknowledge()"
  >
    I'm 18+, let me in
  </button>
</div>
