<div class="card step-card">
  <div class="step-icon">📅</div>
  <h2>When should this happen?</h2>
  <p class="subtext">Pick a date on the calendar.</p>

  <div class="choice-grid">
    @for (option of options; track option.value) {
      <button type="button" class="choice-button" (click)="choose(option.value)">
        {{ option.label }}
      </button>
    }
  </div>

  <button type="button" class="back-link" (click)="back()">← back</button>
</div>
