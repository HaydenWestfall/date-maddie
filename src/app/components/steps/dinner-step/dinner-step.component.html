<div class="card step-card">
  <div class="step-icon">🍽️</div>
  <h2>Where should we eat?</h2>
  <p class="subtext">What kind of cuisine are you in the mood for Chef?</p>

  <div class="choice-grid">
    @for (option of options; track option) {
      <button type="button" class="choice-button" (click)="choose(option)">
        {{ option }}
      </button>
    }
  </div>

  <button type="button" class="back-link" (click)="back()">← back</button>
</div>
